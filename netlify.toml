[build]
  command = "node scripts/prepare-netlify-public.js"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # pdfkit and xlsx read data files at runtime, so ship them unbundled.
  external_node_modules = ["pdfkit", "xlsx"]

[functions."automatic-backup"]
  schedule = "10 21 * * *"

[functions."monthly-close"]
  schedule = "5 21 28-31 * *"
